<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="ラスチカス 女子ラクロス部 選手名鑑">
  <title>ラスチカス 選手名鑑</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header__inner">
        <div class="header__brand">
          <img class="header__badge" id="teamBadge" src="icons/laschicas.jpg" alt="ラスチカス" width="44" height="44">
          <div>
            <h1 class="header__title" id="teamName">ラスチカス</h1>
            <p class="header__season" id="teamSeason">2026シーズン</p>
            <p class="header__subtitle" id="teamSubtitle">南山大学女子ラクロス部</p>
          </div>
        </div>
        <button class="header__view-toggle" id="viewToggle" type="button" aria-label="一覧表示に切替" title="一覧表示に切替">
          <svg class="icon-grid" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <svg class="icon-list hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- 検索 -->
      <div class="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" class="search__input" id="searchInput" placeholder="選手名・CN・UN・学部で検索" autocomplete="off" enterkeyhint="search">
        <button class="search__clear hidden" id="searchClear" aria-label="検索をクリア">×</button>
      </div>

      <!-- 絞り込みモード -->
      <div class="group-mode" id="groupMode">
        <button class="group-mode__btn active" data-mode="position">ポジション別</button>
        <button class="group-mode__btn" data-mode="grade">学年別</button>
        <button class="group-mode__btn" data-mode="un">UN順</button>
      </div>

      <!-- 絞り込みチップ -->
      <div class="filters" id="subFilters">
        <button class="filter-chip active" data-filter="all">すべて</button>
      </div>
    </header>

    <!-- 選手一覧 -->
    <main class="main">
      <div id="playerSections"></div>
      <div class="empty-state hidden" id="emptyState">
        <p class="empty-state__title">該当する選手がいません</p>
        <p class="empty-state__desc">検索条件を変えてみてください</p>
      </div>
    </main>

    <!-- ボトムシート（選手詳細） -->
    <div class="overlay hidden" id="overlay"></div>
    <div class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
      <div class="bottom-sheet__handle" id="sheetHandle">
        <span class="bottom-sheet__grab"></span>
      </div>
      <div class="bottom-sheet__content" id="sheetContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
